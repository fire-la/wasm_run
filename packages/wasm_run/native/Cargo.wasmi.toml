[package]
name = "wasm_run_dart"
version = "0.1.0"
edition = "2021"
description = "Wasmi-runtime config (iOS family). Mirrors the default Cargo.toml dependency set (known-good, Cargo.lock already resolves it) but defaults to the wasmi 1.0.8 runtime instead of wasmtime. Aligns the stale wasmi 0.31.0 pin that was incompatible with api_wasmi.rs (wasmi 1.0 API) and violated ADR-0101 (iOS wasmi >= 1.0)."

[lib]
crate-type = ["staticlib", "cdylib"]

[build-dependencies]
flutter_rust_bridge_codegen = "1.82.6"

[dependencies]
flutter_rust_bridge = "1.82.6"
anyhow = "1.0.100"
once_cell = "1.21.3"
wat = "1.244.0"

rayon = "1.11.0"
cap-std = "4.0.0"

# Wasmtime runtime (optional here — wasmi is the default for this config)
wasmtime = { version = "41.0.1", optional = true, features = ["component-model"] }
wasmtime-wasi = { version = "41.0.1", optional = true }

# Wasmi runtime (default for this config) - ADR-0101 hard constraint: iOS wasmi >= 1.0
wasmi = { version = "1.0.8", optional = true }
wasmi_wasi = { version = "1.0.8", optional = true }

[features]
# Default to wasmi (iOS forbids JIT; wasmi 1.0 interpreter is the ADR-0101 path)
default = ["wasmi-runtime", "wasi"]

# Use wasmtime runtime (unused on iOS; kept for parity with the default manifest)
wasmtime-runtime = ["wasmtime", "wasmtime-wasi"]

# Use wasmi interpreter (no threads/GC, but works on iOS) + SIMD
wasmi-runtime = ["wasmi", "wasmi_wasi", "simd"]

# Enable WASI support
wasi = []

# Enable SIMD support for wasmi (opt-in due to code size)
simd = ["wasmi/simd"]
